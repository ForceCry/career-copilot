services:
  api:
    build: .
    ports:
      # Bound to loopback, not every interface - candidate PII, and
      # unauthenticated endpoints that trigger paid Claude calls, aren't
      # meant to be reachable from the LAN. Flagged by an independent
      # Codex review (same class of finding as the embeddings service
      # below, fixed the same way there already).
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    volumes:
      # Read-only, and deliberately just these two files rather than the
      # whole ~/.claude directory - confirmed live that `claude -p` only
      # needs .credentials.json (the OAuth session) and settings.json to
      # run non-interactively; the full directory also holds this user's
      # conversation history/memory/tasks across every other project on
      # the machine, none of which this container has any reason to read.
      # Same cost as before when confirmed (~$0.003/call from PROJECT_ROOT,
      # matching the existing $0.0024 baseline noted in llm_scorer.py).
      # Paths are under /home/appuser, not /root - the Dockerfile now runs
      # this service as a non-root user (also flagged by an independent
      # Codex review).
      - ${HOME}/.claude/.credentials.json:/home/appuser/.claude/.credentials.json:ro
      - ${HOME}/.claude/settings.json:/home/appuser/.claude/settings.json:ro
      - ${HOME}/.claude.json:/home/appuser/.claude.json:ro
    restart: unless-stopped

  embedding-worker:
    build: .
    command: ["python", "scripts/embedding_worker.py"]
    ports:
      - "127.0.0.1:9100:9100"  # Prometheus metrics, exposed for local inspection too
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    restart: unless-stopped

  # In-stack alternative to wiring scripts/ingest.py into your own host
  # crontab (still documented and fully supported - see the script's
  # docstring). Opt-in via the "scheduler" Compose profile, not started
  # by plain `docker compose up`: `docker compose --profile scheduler up
  # -d`. Deliberately not on by default - this repo is public, and
  # cloning it shouldn't silently start hitting Adzuna's rate-limited API
  # or scraping justjoin.it on a schedule without an explicit decision to
  # do that. Only needs MySQL (to write vacancies + ingestion_run rows)
  # and RabbitMQ (to queue new ones for embedding) - not Elasticsearch or
  # the embeddings service, which embedding-worker depends on instead.
  scheduler:
    build: .
    command: ["supercronic", "/app/scheduler/crontab"]
    profiles: ["scheduler"]
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    # Pinned rather than the `8` major-version tag: an independent Codex
    # review flagged that a floating tag means "docker compose pull" can
    # silently jump minor versions on a rebuild, with no signal that it
    # happened. Bump deliberately when there's a reason to.
    image: mysql:8.4.11
    ports:
      - "127.0.0.1:3306:3306"  # exposed for local (non-Docker) dev too, not just the api container
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-career_copilot}
      MYSQL_USER: ${MYSQL_USER:-career_copilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-career_copilot}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    ports:
      - "127.0.0.1:9200:9200"  # exposed for local (non-Docker) dev too
    environment:
      discovery.type: single-node
      # No auth (xpack.security disabled) is only an acceptable trade
      # because this is bound to loopback, single-user, local-only - not
      # a default to copy into anything that touches a real network.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    # Pinned to the last 3.x patch rather than the floating `3-management`
    # tag (same reasoning as mysql above) - deliberately not jumping to
    # 4.x here since that's a real major-version upgrade to evaluate on
    # its own, not something that should ride along with a pin.
    image: rabbitmq:3.13.7-management
    # Enables the built-in Prometheus plugin (metrics on :15692) before
    # starting the broker - not on by default even in the -management image.
    command: >
      bash -c "rabbitmq-plugins enable --offline rabbitmq_prometheus &&
      docker-entrypoint.sh rabbitmq-server"
    ports:
      - "127.0.0.1:5672:5672"    # AMQP, exposed for local (non-Docker) dev too
      - "127.0.0.1:15672:15672"  # management UI (default guest/guest - loopback-only is what makes that acceptable)
      - "127.0.0.1:15692:15692"  # Prometheus metrics
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Hugging Face text-embeddings-inference, serving the multilingual-e5-base
  # model used for vector search. Used to live in a separate repo
  # (career-copilot-infra) published on a shared cross-project Docker
  # network, on the theory it might be reused by other projects later -
  # that never happened, and the indirection made the whole system harder
  # to understand for no real benefit, so it's merged in here now.
  embeddings:
    # Pinned by digest, not the mutable `cpu-latest` tag - a later pull
    # could otherwise silently change the inference server, breaking
    # reproducibility. Resolved from `cpu-latest` on 2026-08-04; bump
    # deliberately, don't let it drift.
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:cb570aabbfa016b86684f576b5bd72d1ee96cc0b7a00b0ad221b298762b32157
    environment:
      MODEL_ID: intfloat/multilingual-e5-base
      # Pinned to the model's current commit SHA (via the HF API) for the
      # same reason as the image digest - the "main" revision can move.
      REVISION: d128750597153bb5987e10b1c3493a34e5a4502a
    ports:
      # Bound to loopback only - an unauthenticated compute service
      # published on every interface is real attack surface, not a
      # hypothetical one. There for local curl/debugging convenience.
      - "127.0.0.1:8081:80"
    volumes:
      # Model weights download here on first startup (~1GB) - gitignored
      # (see .gitignore's `data/` pattern), not committed. No manual
      # download step needed: `docker compose up` fetches them
      # automatically before the service reports healthy.
      - ./infra/data/hf-cache:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    # No limits meant this could exhaust host CPU/RAM and disrupt every
    # other local service - confirmed via `docker stats` that a normal
    # idle instance already sits around 2.8GiB RSS, with TEI configured
    # for up to 512 concurrent requests. Flagged by an independent Codex
    # review. Headroom above observed usage, not a tight ceiling.
    mem_limit: 4g
    cpus: 4.0
    pids_limit: 200
    # Blocks privilege escalation via setuid/setgid binaries inside the
    # container - cheap, standard hardening, doesn't require knowing
    # anything about what the image itself needs to run correctly (unlike
    # forcing a non-root user, which risks breaking the image's own
    # /data write permissions without verifying it supports that first).
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.2
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.2
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Anonymous admin access is only acceptable because this is
      # loopback-only, single-user - flagged correctly by an independent
      # Codex review as a real risk if it were ever reachable from the LAN.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  mysql-data:
  es-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
