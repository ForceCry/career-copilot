[tool.ruff]
line-length = 110
target-version = "py312"
# Alembic-generated - Alembic's own template conventions (Union[...] over
# X | Y, etc.), not hand-written code worth reformatting on every
# `alembic revision --autogenerate`.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
