[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "justjoinit-scraper"
version = "0.1.0"
description = "Sitemap + JSON-LD reader for justjoin.it job postings (no private API used)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/justjoinit_scraper"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
