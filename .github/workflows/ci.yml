name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  career-copilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test
        run: pytest tests/ -v

  adzuna-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/adzuna-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test
        run: pytest tests/ -v

  arbeitnow-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/arbeitnow-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test
        run: pytest tests/ -v

  justjoinit-scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/justjoinit-scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test
        run: pytest tests/ -v

  infra-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .env is gitignored (real local secrets), so a fresh checkout -
      # this runner included - never has one, same as a fresh clone. The
      # api/embedding-worker services' env_file: .env makes `docker
      # compose config` hard-fail if the file doesn't exist at all, not
      # just have missing vars - confirmed live (first real CI run on
      # the public repo failed on exactly this). .env.example is exactly
      # what Setup/AGENTS.md/DEPLOYMENT.md already tell a real user to
      # copy first, so this mirrors actual onboarding rather than
      # papering over the check.
      - name: Prepare .env
        run: cp .env.example .env

      - name: Validate docker-compose config
        run: docker compose config -q
